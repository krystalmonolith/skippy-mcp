name: release

# Builds and publishes the SkippyMCP .deb + Docker image. SkippyMCP is the
# release artifact of this monorepo; stimpy-mcp/rig-contract are not published
# here. Triggered by a v* tag (cuts a GitHub Release) or run manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create GitHub Releases
  packages: write   # push images to GHCR

defaults:
  run:
    working-directory: packages/skippy-mcp

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build .deb
        run: PYTHON=python ./packaging/build-deb.sh
      # `files:`/`path:` below are repo-root-relative (defaults.working-directory
      # only applies to `run:` steps, not to actions).
      - name: Publish .deb to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: packages/skippy-mcp/build/deb/*.deb
          generate_release_notes: true
      - name: Upload .deb artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: skippy-mcp-deb
          path: packages/skippy-mcp/build/deb/*.deb

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: packages/skippy-mcp
          push: true
          tags: |
            ghcr.io/krystalmonolith/skippy-mcp:${{ steps.ver.outputs.version }}
            ghcr.io/krystalmonolith/skippy-mcp:latest
