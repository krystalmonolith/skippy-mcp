[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-contract"
version = "0.3.4"
description = "Shared pin-map + pattern contract for the SkippyMCP/StimpyMCP digital-stimulus rig."
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mark Deazley" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rig_contract = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
