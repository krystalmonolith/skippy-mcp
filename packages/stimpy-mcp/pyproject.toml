[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stimpy-mcp"
version = "0.1.0"
description = "An MCP server that drives a Raspberry Pi GPIO digital-stimulus generator via lgpio."
requires-python = ">=3.11"
dependencies = [
    "rig-contract>=0.1.0",
    "mcp>=1.2.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "lgpio>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
stimpy-mcp = "stimpy_mcp.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["lgpio", "mcp.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
